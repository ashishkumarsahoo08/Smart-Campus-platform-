# ==============================================================================
# SMART CAMPUS UNIFIED PLATFORM - DOCKER COMPOSE ORCHESTRATION
# Run from project root: docker compose -f docker/docker-compose.yml up -d
# ==============================================================================

version: '3.8'

services:
  campus-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: smart-campus-platform:2.0
    container_name: smart-campus-server
    restart: unless-stopped
    ports:
      - "3042:3042"
      - "3443:3443"
    environment:
      - NODE_ENV=production
      - PORT=3042
      - HTTPS_PORT=3443
      - HOST=0.0.0.0
    env_file:
      - ../.env
    volumes:
      # Persistent campus database storage & automated snapshots
      - ../backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
