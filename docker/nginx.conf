# ==============================================================================
# SMART CAMPUS UNIFIED PLATFORM - NGINX PRODUCTION REVERSE PROXY
# Place in: /etc/nginx/sites-available/smart-campus.conf
# ==============================================================================

# Rate limiting zone (prevents brute-force on auth endpoints)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

upstream smart_campus_backend {
    server 127.0.0.1:3042;
    keepalive 32;
}

# Redirect all HTTP traffic to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name campus.yourdomain.edu www.campus.yourdomain.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Secure Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus.yourdomain.edu;

    # SSL Certificate Paths (Let's Encrypt / Institutional CA)
    ssl_certificate /etc/letsencrypt/live/campus.yourdomain.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.yourdomain.edu/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max body upload size for documents / sick notes
    client_max_body_size 16M;

    # Authentication Route Rate Limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://smart_campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://smart_campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Assets & PWA Shell
    location / {
        proxy_pass http://smart_campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
