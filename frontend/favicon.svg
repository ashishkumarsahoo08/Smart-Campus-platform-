<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Graduation Mortarboard / Academic Cap -->
  <path d="M32 14 L52 24 L32 34 L12 24 Z" fill="url(#grad)" filter="url(#glow)"/>
  <path d="M20 28.5 L20 40 C20 44 44 44 44 40 L44 28.5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Tassel -->
  <path d="M48 26 L48 37 C48 39 46 40 45 40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="45" cy="41" r="1.5" fill="#fbbf24"/>
  
  <!-- Digital Core Node -->
  <circle cx="32" cy="47" r="3" fill="#10b981"/>
  <path d="M25 47 L29 47 M35 47 L39 47" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
</svg>
